<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <style>
    .bg{fill:#1a1a19}
    .panel-title{fill:#ffffff;font-size:18px;font-weight:700}
    .lbl{fill:#c3c2b7;font-size:13px}
    .lbl-mut{fill:#898781;font-size:12px}
    .wick{stroke:#c3c2b7;stroke-width:3;stroke-linecap:round}
    .connector{stroke:#898781;stroke-width:1.5;stroke-dasharray:3,3}
    .divider{stroke:#2c2c2a;stroke-width:1}
  </style>
  <rect class="bg" width="800" height="500"/>

  <!-- Left panel: anatomy -->
  <text x="40" y="42" class="panel-title">Anatomy of a Candle</text>
  <line x1="200" y1="70" x2="200" y2="430" class="wick"/>
  <rect x="165" y="170" width="70" height="140" rx="3" fill="#0ca30c"/>

  <line x1="235" y1="70" x2="300" y2="70" class="connector"/>
  <text x="308" y="75" class="lbl">HIGH — highest price reached</text>

  <line x1="235" y1="170" x2="300" y2="170" class="connector"/>
  <text x="308" y="175" class="lbl">CLOSE — price at period end</text>

  <line x1="235" y1="310" x2="300" y2="310" class="connector"/>
  <text x="308" y="315" class="lbl">OPEN — price at period start</text>

  <line x1="235" y1="430" x2="300" y2="430" class="connector"/>
  <text x="308" y="435" class="lbl">LOW — lowest price reached</text>

  <text x="200" y="460" text-anchor="middle" class="lbl-mut">BODY = open→close range</text>
  <text x="200" y="478" text-anchor="middle" class="lbl-mut">WICKS = high/low extremes</text>

  <line x1="400" y1="20" x2="400" y2="480" class="divider"/>

  <!-- Right panel: bullish vs bearish -->
  <text x="440" y="42" class="panel-title">Bullish vs. Bearish</text>

  <line x1="520" y1="110" x2="520" y2="380" class="wick"/>
  <rect x="490" y="180" width="60" height="120" rx="3" fill="#0ca30c"/>
  <text x="520" y="410" text-anchor="middle" class="lbl" font-weight="700">BULLISH</text>
  <text x="520" y="430" text-anchor="middle" class="lbl-mut">close &gt; open</text>
  <line x1="565" y1="290" x2="565" y2="190" stroke="#0ca30c" stroke-width="2" marker-end="url(#arrowUp)"/>

  <line x1="680" y1="110" x2="680" y2="380" class="wick"/>
  <rect x="650" y="180" width="60" height="120" rx="3" fill="#d03b3b"/>
  <text x="680" y="410" text-anchor="middle" class="lbl" font-weight="700">BEARISH</text>
  <text x="680" y="430" text-anchor="middle" class="lbl-mut">close &lt; open</text>
  <line x1="725" y1="190" x2="725" y2="290" stroke="#d03b3b" stroke-width="2" marker-end="url(#arrowDown)"/>

  <defs>
    <marker id="arrowUp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0ca30c"/>
    </marker>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d03b3b"/>
    </marker>
  </defs>
</svg>
