<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <style>
    .bg{fill:#1a1a19}
    .panel{fill:#202220;stroke:#2c2c2a;stroke-width:1}
    .title{fill:#ffffff;font-size:17px;font-weight:700}
    .cap{fill:#c3c2b7;font-size:12.5px}
    .wick{stroke:#c3c2b7;stroke-width:3;stroke-linecap:round}
  </style>
  <rect class="bg" width="800" height="560"/>

  <!-- Q1: Hammer -->
  <g transform="translate(20,20)">
    <rect class="panel" width="360" height="250" rx="10"/>
    <text x="20" y="34" class="title">🔨 Hammer</text>
    <line x1="150" y1="45" x2="150" y2="215" class="wick"/>
    <rect x="125" y="60" width="50" height="45" rx="3" fill="#0ca30c"/>
    <text x="180" y="235" class="cap">Small body at top, long lower wick — bullish after a downtrend</text>
  </g>

  <!-- Q2: Bullish Engulfing -->
  <g transform="translate(420,20)">
    <rect class="panel" width="360" height="250" rx="10"/>
    <text x="20" y="34" class="title">🤝 Bullish Engulfing</text>
    <line x1="110" y1="90" x2="110" y2="160" class="wick"/>
    <rect x="90" y="105" width="40" height="40" rx="3" fill="#d03b3b"/>
    <line x1="220" y1="55" x2="220" y2="195" class="wick"/>
    <rect x="190" y="70" width="60" height="110" rx="3" fill="#0ca30c"/>
    <text x="20" y="235" class="cap">Big green candle fully covers the prior red candle's body</text>
  </g>

  <!-- Q3: Morning Star -->
  <g transform="translate(20,300)">
    <rect class="panel" width="360" height="250" rx="10"/>
    <text x="20" y="34" class="title">⭐ Morning Star</text>
    <line x1="80" y1="55" x2="80" y2="180" class="wick"/>
    <rect x="55" y="65" width="50" height="100" rx="3" fill="#d03b3b"/>
    <line x1="170" y1="185" x2="170" y2="225" class="wick"/>
    <rect x="155" y="198" width="30" height="16" rx="2" fill="#898781"/>
    <line x1="260" y1="65" x2="260" y2="195" class="wick"/>
    <rect x="230" y="80" width="60" height="105" rx="3" fill="#0ca30c"/>
    <text x="20" y="235" class="cap">Red → small indecision candle → large green reversal</text>
  </g>

  <!-- Q4: Three White Soldiers -->
  <g transform="translate(420,300)">
    <rect class="panel" width="360" height="250" rx="10"/>
    <text x="20" y="34" class="title">💪 Three White Soldiers</text>
    <line x1="80" y1="150" x2="80" y2="230" class="wick"/>
    <rect x="60" y="160" width="40" height="60" rx="3" fill="#0ca30c"/>
    <line x1="160" y1="100" x2="160" y2="200" class="wick"/>
    <rect x="140" y="110" width="40" height="80" rx="3" fill="#0ca30c"/>
    <line x1="240" y1="50" x2="240" y2="170" class="wick"/>
    <rect x="220" y="60" width="40" height="100" rx="3" fill="#0ca30c"/>
    <text x="20" y="235" class="cap">Three consecutive green candles, each closing higher</text>
  </g>
</svg>
