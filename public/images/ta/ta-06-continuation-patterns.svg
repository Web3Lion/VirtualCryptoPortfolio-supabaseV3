<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <style>
    .bg{fill:#1a1a19}
    .panel{fill:#202220;stroke:#2c2c2a;stroke-width:1}
    .title{fill:#ffffff;font-size:17px;font-weight:700}
    .cap{fill:#c3c2b7;font-size:12.5px}
    .lbl{fill:#898781;font-size:11px}
    .price{fill:none;stroke:#ffffff;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
    .ref{fill:none;stroke:#3987e5;stroke-width:2;stroke-dasharray:6,4}
  </style>
  <rect class="bg" width="800" height="560"/>

  <!-- Q1: Bull Flag -->
  <g transform="translate(20,20)">
    <rect class="panel" width="360" height="250" rx="10"/>
    <text x="20" y="34" class="title">🚩 Bull Flag</text>
    <path class="price" d="M20,220 L90,60 L130,90 L170,75 L210,100 L250,85 L330,20" stroke="#0ca30c"/>
    <text x="45" y="150" class="lbl">pole</text>
    <text x="170" y="125" class="lbl">flag</text>
    <text x="20" y="235" class="cap">Sharp rally, brief pullback, breakout continues up</text>
  </g>

  <!-- Q2: Bear Flag -->
  <g transform="translate(420,20)">
    <rect class="panel" width="360" height="250" rx="10"/>
    <text x="20" y="34" class="title">🚩 Bear Flag</text>
    <path class="price" d="M20,50 L90,200 L130,175 L170,190 L210,165 L250,180 L330,230" stroke="#d03b3b"/>
    <text x="45" y="130" class="lbl">pole</text>
    <text x="170" y="205" class="lbl">flag</text>
    <text x="20" y="235" class="cap">Sharp drop, brief bounce, breakdown continues down</text>
  </g>

  <!-- Q3: Triangles -->
  <g transform="translate(20,300)">
    <rect class="panel" width="360" height="250" rx="10"/>
    <text x="20" y="34" class="title">📐 Triangles</text>

    <g transform="translate(20,55)">
      <line x1="0" y1="20" x2="95" y2="20" class="ref"/>
      <line x1="0" y1="110" x2="95" y2="40" class="ref"/>
      <path class="price" d="M0,80 L25,20 L45,55 L65,20 L90,35"/>
      <text x="47" y="140" text-anchor="middle" class="lbl">Ascending</text>
    </g>

    <g transform="translate(135,55)">
      <line x1="0" y1="20" x2="95" y2="70" class="ref"/>
      <line x1="0" y1="110" x2="95" y2="110" class="ref"/>
      <path class="price" d="M0,50 L25,110 L45,80 L65,110 L90,95"/>
      <text x="47" y="140" text-anchor="middle" class="lbl">Descending</text>
    </g>

    <g transform="translate(250,55)">
      <line x1="0" y1="20" x2="95" y2="65" class="ref"/>
      <line x1="0" y1="110" x2="95" y2="65" class="ref"/>
      <path class="price" d="M0,65 L25,30 L45,95 L65,50 L90,65"/>
      <text x="47" y="140" text-anchor="middle" class="lbl">Symmetrical</text>
    </g>
  </g>

  <!-- Q4: Cup & Handle -->
  <g transform="translate(420,300)">
    <rect class="panel" width="360" height="250" rx="10"/>
    <text x="20" y="34" class="title">☕ Cup &amp; Handle</text>
    <path class="price" d="M20,80 Q150,220 280,80 L300,105 L320,90 L345,45" stroke="#0ca30c"/>
    <text x="150" y="215" text-anchor="middle" class="lbl">cup (rounded bottom)</text>
    <text x="305" y="130" class="lbl">handle</text>
    <text x="20" y="235" class="cap">Rounded recovery, small pullback, breakout to new highs</text>
  </g>
</svg>
