<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <style>
    .bg{fill:#1a1a19}
    .panel{fill:#202220;stroke:#2c2c2a;stroke-width:1}
    .title{fill:#ffffff;font-size:17px;font-weight:700}
    .cap{fill:#c3c2b7;font-size:12.5px}
    .lbl{fill:#898781;font-size:11.5px}
    .price{fill:none;stroke:#ffffff;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
    .neck{fill:none;stroke:#3987e5;stroke-width:2;stroke-dasharray:7,5}
  </style>
  <rect class="bg" width="800" height="560"/>

  <!-- Q1: Head & Shoulders -->
  <g transform="translate(20,20)">
    <rect class="panel" width="360" height="250" rx="10"/>
    <text x="20" y="34" class="title">👤 Head &amp; Shoulders</text>
    <line x1="90" y1="160" x2="330" y2="160" class="neck"/>
    <path class="price" d="M20,190 L70,100 L110,160 L170,50 L230,160 L280,105 L330,220"/>
    <text x="70" y="90" text-anchor="middle" class="lbl">LS</text>
    <text x="170" y="40" text-anchor="middle" class="lbl">HEAD</text>
    <text x="280" y="95" text-anchor="middle" class="lbl">RS</text>
    <text x="20" y="235" class="cap">Break below the neckline confirms a bearish reversal</text>
  </g>

  <!-- Q2: Inverse Head & Shoulders -->
  <g transform="translate(420,20)">
    <rect class="panel" width="360" height="250" rx="10"/>
    <text x="20" y="34" class="title">🙃 Inverse Head &amp; Shoulders</text>
    <line x1="90" y1="110" x2="330" y2="110" class="neck"/>
    <path class="price" d="M20,80 L70,170 L110,110 L170,220 L230,110 L280,165 L330,60"/>
    <text x="70" y="188" text-anchor="middle" class="lbl">LS</text>
    <text x="170" y="238" text-anchor="middle" class="lbl">HEAD</text>
    <text x="280" y="183" text-anchor="middle" class="lbl">RS</text>
    <text x="20" y="235" class="cap">Break above the neckline confirms a bullish reversal</text>
  </g>

  <!-- Q3: Double Top -->
  <g transform="translate(20,300)">
    <rect class="panel" width="360" height="250" rx="10"/>
    <text x="20" y="34" class="title">🏔️ Double Top (M)</text>
    <line x1="60" y1="150" x2="300" y2="150" class="neck"/>
    <path class="price" d="M20,190 L90,80 L150,150 L210,82 L300,220"/>
    <text x="20" y="235" class="cap">Two equal peaks — break below the valley confirms bearish</text>
  </g>

  <!-- Q4: Double Bottom -->
  <g transform="translate(420,300)">
    <rect class="panel" width="360" height="250" rx="10"/>
    <text x="20" y="34" class="title">📉 Double Bottom (W)</text>
    <line x1="60" y1="120" x2="300" y2="120" class="neck"/>
    <path class="price" d="M20,80 L90,190 L150,120 L210,188 L300,60"/>
    <text x="20" y="235" class="cap">Two equal lows — break above the peak confirms bullish</text>
  </g>
</svg>
